<html>

<div class="loader-card">
  <h1 id="msgs" class="loader-msg">Loading Payload... Please Wait</h1>
  <div class="loader-bar"><span></span></div>
  <p class="loader-hint">Keep the browser open while the host is restored</p>

<script>
function allset(){
msgs.innerHTML = LoadedMSG
}

function load_poc(){
 var req = new XMLHttpRequest();
 req.responseType = "arraybuffer";
 req.open('GET', PLfile);
 req.send();
 req.onreadystatechange = function () {
  if (req.readyState == 4) {
   PLD = req.response;
   var payload_buffer = chain.syscall(477, 0, PLD.byteLength*4 , 7, 0x1002, -1, 0);
   var pl = p.array_from_address(payload_buffer, PLD.byteLength*4);
   var padding = new Uint8Array(4 - (req.response.byteLength % 4) % 4);
   var tmp = new Uint8Array(req.response.byteLength + padding.byteLength);
   tmp.set(new Uint8Array(req.response), 0);
   tmp.set(padding, req.response.byteLength);
   var shellcode = new Uint32Array(tmp.buffer);
   pl.set(shellcode,0);
   var pthread = p.malloc(0x10);
   chain.call(libKernelBase.add32(OFFSET_lk_pthread_create), pthread, 0x0, payload_buffer, 0);
   allset();
  }
 };
}

function jbdone(){
LoadedMSG = "Payload Loaded ...";
PLfile = "payload.bin";
setTimeout(load_poc, 500);
}
</script>
<script>
/* UI only: turn the loading bar green once a result text appears */
(function(){
try{
var msg=document.getElementById('msgs');
var bar=document.querySelector('.loader-bar');
if(!msg||!bar)return;
var t=setInterval(function(){
var s=(msg.innerHTML||'').toLowerCase();
if(s.indexOf('loaded')>-1||s.indexOf('success')>-1||s.indexOf('installed')>-1||s.indexOf('error')>-1){
bar.className='loader-bar done';
clearInterval(t);
}
},600);
}catch(e){}
})();
</script>
