<!DOCTYPE html>
<html manifest="700.manifest">
<head>
<title>PS4 [5.05] 7.00 - 14.02 FW GoldHEN Host by GamerHack</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>
<header class="fw-hero">
  <span class="fw-hero-num">7.00+</span>
  <span class="fw-hero-tag">Offline Cache</span>
  <span class="fw-hero-by">PS4 7.00 &ndash; 8.52 &middot; by GamerHack</span>
</header>

<div class="loader-card">
  <h1 id="msgs" class="loader-msg">Starting Cache Installation...</h1>
  <div class="loader-bar"><span></span></div>
  <p class="loader-hint">Keep the browser open while the cache installs</p>
</div>

<div class="thanks">
  <span class="thanks-label">Special thanks</span>
  <a class="person" href="https://twitter.com/_AlAzif">@_AlAzif</a><span class="person">ChendoChap</span><a class="person" href="https://x.com/Kameleonre_">@Kameleonre_</a><span class="person">SiSTR0</span><span class="person">Abc</span>
</div>
<script>
/* UI only: turn the loading bar green once a result text appears */
(function(){
try{
var msg=document.getElementById('msgs');
var bar=document.querySelector('.loader-bar');
if(!msg||!bar)return;
var t=setInterval(function(){
var s=(msg.innerHTML||'').toLowerCase();
if(s.indexOf('loaded')>-1||s.indexOf('success')>-1||s.indexOf('installed')>-1||s.indexOf('error')>-1){
bar.className='loader-bar done';
clearInterval(t);
}
},600);
}catch(e){}
})();
</script>
</body>
</html>
